<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zola — Luban Omanais Premium</title>
<meta name="description" content="Résine de luban omanais premium 100% naturelle du Dhofar — paiement à la livraison dans toutes les wilayas d'Algérie">
<link rel="icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-panel splash-panel-l"></div>
  <div class="splash-panel splash-panel-r"></div>
  <div class="splash-particles" id="splashParticles"></div>
  <div class="splash-content">
    <div class="splash-glow"></div>
    <div class="splash-ring splash-ring-1"></div>
    <div class="splash-ring splash-ring-2"></div>
    <img id="splashLogo" src="images/logo.png" alt="">
    <span class="splash-line"></span>
    <span class="splash-word" dir="ltr">
      <span style="--i:0">Z</span><span style="--i:1">O</span><span style="--i:2">L</span><span style="--i:3">A</span>
    </span>
    <span class="splash-sub" id="splashSub"></span>
  </div>
</div>
<script>document.body.classList.add('splash-lock');</script>

<div class="scroll-progress" id="scrollProgress" aria-hidden="true"><span id="scrollProgressBar"></span></div>

<!-- ===== Header ===== -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="#top">
      <img id="logoImg" src="images/logo.png" alt="Zola">
    </a>

    <nav class="nav-links" id="navLinks" aria-label="Sections">
      <a href="#product" data-i18n="product_title"></a>
      <a href="#story" data-i18n="story_title"></a>
      <a href="#faqSection" id="navFaqLink" data-i18n="faq_title"></a>
      <a href="#order" data-i18n="hero_cta"></a>
      <a href="#contact" data-i18n="contact_title"></a>
    </nav>

    <div class="header-controls">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span id="themeIcon" class="icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></svg>
        </span>
      </button>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="ar" class="lang-btn">عربي</button>
        <button data-lang="fr" class="lang-btn">FR</button>
        <button data-lang="en" class="lang-btn">EN</button>
      </div>
      <button id="menuToggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- mobile slide-down menu (same links, shown via hamburger) -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#product" data-i18n="product_title"></a>
    <a href="#story" data-i18n="story_title"></a>
    <a href="#faqSection" id="navFaqLinkMobile" data-i18n="faq_title"></a>
    <a href="#order" data-i18n="hero_cta"></a>
    <a href="#contact" data-i18n="contact_title"></a>
  </div>
</header>
<div class="mobile-menu-backdrop" id="mobileMenuBackdrop" hidden></div>

<main id="top">

  <!-- ===== Hero (black + gold) ===== -->
  <section class="hero" id="hero">
    <video id="heroVideoEl" class="hero-video" muted loop playsinline autoplay preload="none" hidden></video>
    <div class="hero-bg" id="heroBg">
      <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span>
      <span class="particle p4"></span><span class="particle p5"></span><span class="particle p6"></span>
    </div>
    <div class="hero-content">
      <div class="hero-ornament icon spin-slow">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c0 6 2.2 9.8 7 11-4.8 1.2-7 5-7 11 0-6-2.2-9.8-7-11 4.8-1.2 7-5 7-11Z"/></svg>
      </div>
      <h1 id="heroHeadline" data-i18n="hero_headline"></h1>
      <p class="hero-sub fade-in-up" id="heroSub" data-i18n="hero_subline"></p>
      <a href="#order" class="btn-gold btn-lg btn-shine pulse-glow fade-in-up tilt" id="heroCta" data-i18n="hero_cta"></a>
      <div class="hero-stats fade-in-up" id="heroStats"></div>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span></span></div>
  </section>

  <!-- ===== Trust badges strip ===== -->
  <section class="badges">
    <div class="badges-shimmer" aria-hidden="true"></div>
    <div class="badges-inner">
      <div class="badge rev-scale" style="--i:0">
        <div class="badge-medallion">
          <span class="badge-ic icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 10 4 18v2h2c8 0 14-6 14-16Z"/><path d="M8 20c2-4 5.5-8 12-14"/></svg></span>
        </div>
        <span class="badge-label" data-i18n="badge_1"></span>
      </div>
      <div class="badge rev-scale" style="--i:1">
        <div class="badge-medallion">
          <span class="badge-ic icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.2 3.4 9.4 8 11 4.6-1.6 8-5.8 8-11V5Z"/><path d="M8.5 12l2.3 2.3L15.5 9.5"/></svg></span>
        </div>
        <span class="badge-label" data-i18n="badge_2"></span>
      </div>
      <div class="badge rev-scale" style="--i:2">
        <div class="badge-medallion">
          <span class="badge-ic icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/></svg></span>
        </div>
        <span class="badge-label" data-i18n="badge_3"></span>
      </div>
      <div class="badge rev-scale" style="--i:3">
        <div class="badge-medallion">
          <span class="badge-ic icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h11v9H2z"/><path d="M13 10h4l3 3v3h-7z"/><circle cx="6.5" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></span>
        </div>
        <span class="badge-label" data-i18n="badge_4"></span>
      </div>
    </div>
  </section>

  <!-- ===== Marquee ticker ===== -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <!-- ===== Promo video (admin-controlled — hidden with no video) ===== -->
  <section class="promo-video darksec" id="promoVideoSection" hidden>
    <div class="container narrow">
      <h2 class="sec-title gold-title rev" data-i18n="video_title"></h2>
      <div class="promo-video-frame rev-scale">
        <video id="promoVideoEl" class="promo-video-el" controls playsinline muted loop preload="metadata"></video>
      </div>
    </div>
  </section>

  <!-- ===== Product (light section) ===== -->
  <section class="product light" id="product">
    <div class="container">
      <h2 class="sec-title dark-title rev" data-i18n="product_title"></h2>
      <div class="product-grid">
        <div class="product-gallery rev-left">
          <div class="product-main-img tilt" id="productMainImg">
            <span class="img-placeholder">ZOLA</span>
          </div>
          <div class="product-thumbs" id="productThumbs"></div>
        </div>
        <div class="product-info rev-right">
          <h3 id="productName"></h3>
          <p id="productDesc" class="product-desc"></p>
          <div class="price-row">
            <span class="price-original" id="priceOriginal" hidden></span>
            <div class="price-tag"><span id="productPrice"></span> <span data-i18n="ui_currency"></span></div>
            <span class="discount-badge" id="discountBadge" hidden></span>
          </div>
          <div class="bogo-badge icon" id="bogoBadge" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 22V7M12 7C10 3 6 3 6 5.5S9 7 12 7Zm0 0c2-4 6-4 6-1.5S15 7 12 7Z"/></svg>
            <span id="bogoBadgeText"></span>
          </div>
          <div class="tier-hints" id="tierHints"></div>
          <div class="stock-note" id="stockNote" hidden><span data-i18n="ui_out_of_stock"></span></div>
          <div class="box-block">
            <h4 data-i18n="product_box_title"></h4>
            <ul id="boxItems"></ul>
          </div>
          <a href="#order" class="btn-gold" data-i18n="hero_cta"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Story (black + gold) ===== -->
  <section class="story darksec" id="story">
    <div class="container">
      <h2 class="sec-title gold-title rev" data-i18n="story_title"></h2>
      <p class="story-intro rev" data-i18n="story_intro"></p>
      <div class="story-grid" id="storyGrid">
        <div class="story-line" aria-hidden="true"></div>
        <div class="story-card rev-scale" style="--i:0">
          <div class="story-num">١</div>
          <h4 data-i18n="story_1_title"></h4>
          <p data-i18n="story_1_text"></p>
        </div>
        <div class="story-card rev-scale" style="--i:1">
          <div class="story-num">٢</div>
          <h4 data-i18n="story_2_title"></h4>
          <p data-i18n="story_2_text"></p>
        </div>
        <div class="story-card rev-scale" style="--i:2">
          <div class="story-num">٣</div>
          <h4 data-i18n="story_3_title"></h4>
          <p data-i18n="story_3_text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Use cases (light) ===== -->
  <section class="uses light" id="uses">
    <div class="container">
      <h2 class="sec-title dark-title rev" data-i18n="uses_title"></h2>
      <div class="uses-grid">
        <div class="use-card rev-scale" style="--i:0">
          <div class="use-ic icon float-bob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1.5-1-2.5-1.5-3.5C17 8 18 10 18 13a6 6 0 1 1-12 0c0-4 2-5 3-7 .6-1.2 1-2.4 1-4Z"/></svg></div>
          <h4 data-i18n="use_1_title"></h4><p data-i18n="use_1_text"></p>
        </div>
        <div class="use-card rev-scale" style="--i:1">
          <div class="use-ic icon float-bob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M4 12h4M16 12h4M6.5 6.5l2 2M15.5 15.5l2 2M17.5 6.5l-2 2M8.5 15.5l-2 2"/></svg></div>
          <h4 data-i18n="use_2_title"></h4><p data-i18n="use_2_text"></p>
        </div>
        <div class="use-card rev-scale" style="--i:2">
          <div class="use-ic icon float-bob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4.5 6.5 8.4 6.5 12A6.5 6.5 0 1 1 5.5 14.5c0-3.6 3-7.5 6.5-12Z"/></svg></div>
          <h4 data-i18n="use_3_title"></h4><p data-i18n="use_3_text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Delivery reassurance ===== -->
  <section class="delivery darksec">
    <div class="container rev">
      <h2 class="sec-title gold-title rev" data-i18n="delivery_title"></h2>
      <p data-i18n="delivery_text"></p>
      <p class="guarantee" data-i18n="guarantee_text"></p>
    </div>
  </section>

  <!-- ===== FAQ (admin-controlled — empty items hide themselves) ===== -->
  <section class="faq light" id="faqSection" hidden>
    <div class="container narrow">
      <h2 class="sec-title dark-title rev" data-i18n="faq_title"></h2>
      <div id="faqList"></div>
    </div>
  </section>

  <!-- ===== Order form (light, high contrast) ===== -->
  <section class="order light" id="order">
    <div class="container narrow">
      <h2 class="sec-title dark-title rev" data-i18n="form_title"></h2>
      <p class="form-sub" data-i18n="form_subtitle"></p>

      <form id="orderForm" novalidate>
        <!-- honeypot -->
        <input type="text" name="website" id="hpField" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label for="fName" data-i18n="ui_name"></label>
          <input id="fName" name="full_name" type="text" autocomplete="name" required>
          <div class="ferr" data-i18n="err_name" hidden></div>
        </div>

        <div class="field">
          <label for="fPhone" data-i18n="ui_phone"></label>
          <input id="fPhone" name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="05 / 06 / 07 …" autocomplete="tel" required>
          <div class="ferr" data-i18n="err_phone" hidden></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fWilaya" data-i18n="ui_wilaya"></label>
            <select id="fWilaya" required></select>
            <div class="ferr" data-i18n="err_wilaya" hidden></div>
          </div>
          <div class="field">
            <label for="fCommune" data-i18n="ui_commune"></label>
            <select id="fCommune" required disabled></select>
            <div class="ferr" data-i18n="err_commune" hidden></div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fQty" data-i18n="ui_quantity"></label>
            <div class="qty-box">
              <button type="button" class="qty-btn" id="qtyMinus">−</button>
              <input id="fQty" type="number" min="1" max="20" value="1" inputmode="numeric">
              <button type="button" class="qty-btn" id="qtyPlus">+</button>
            </div>
            <div class="tier-hint-form" id="orderTierHint" hidden></div>
            <div class="bogo-hint-form" id="orderBogoHint" hidden></div>
          </div>
          <div class="field">
            <label data-i18n="ui_delivery_type"></label>
            <div class="seg">
              <label class="seg-opt"><input type="radio" name="dtype" value="home" checked><span data-i18n="ui_home"></span></label>
              <label class="seg-opt"><input type="radio" name="dtype" value="desk"><span data-i18n="ui_desk"></span></label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="fAddress" data-i18n="ui_address"></label>
          <input id="fAddress" type="text" autocomplete="street-address">
        </div>

        <div class="free-delivery-hint" id="freeDeliveryHint" hidden></div>

        <div class="totals" id="totalsBox">
          <div class="t-row" id="tFreeRow" hidden><span id="tFreeLabel"></span><b id="tFreeVal"></b></div>
          <div class="t-row"><span data-i18n="ui_product_total"></span><b><span id="tProduct">—</span> <span data-i18n="ui_currency"></span></b></div>
          <div class="t-row"><span data-i18n="ui_delivery_fee"></span><b><span id="tDelivery">—</span> <span data-i18n="ui_currency"></span></b></div>
          <div class="t-row t-grand"><span data-i18n="ui_total"></span><b><span id="tTotal">—</span> <span data-i18n="ui_currency"></span></b></div>
        </div>

        <div class="form-error" id="formError" hidden></div>

        <button type="submit" class="btn-gold btn-lg btn-block" id="submitBtn">
          <span data-i18n="ui_submit"></span>
        </button>
      </form>
    </div>
  </section>

  <!-- ===== Contact (dark) ===== -->
  <section class="contact darksec" id="contact">
    <div class="container narrow">
      <h2 class="sec-title gold-title rev" data-i18n="contact_title"></h2>
      <form id="contactForm" novalidate>
        <input type="text" name="website" id="hpField2" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field">
          <label for="cName" data-i18n="ui_name"></label>
          <input id="cName" type="text">
          <div class="ferr" data-i18n="err_name" hidden></div>
        </div>
        <div class="field">
          <label for="cContact" data-i18n="ui_phone"></label>
          <input id="cContact" type="text" dir="ltr">
          <div class="ferr" data-i18n="err_contact" hidden></div>
        </div>
        <div class="field">
          <label for="cMsg" data-i18n="contact_message"></label>
          <textarea id="cMsg" rows="4"></textarea>
          <div class="ferr" data-i18n="err_message" hidden></div>
        </div>
        <div class="form-error" id="contactError" hidden></div>
        <div class="form-ok" id="contactOk" data-i18n="contact_success" hidden></div>
        <button type="submit" class="btn-outline-gold" id="contactBtn" data-i18n="contact_send"></button>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-ornament icon spin-slow">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c0 6 2.2 9.8 7 11-4.8 1.2-7 5-7 11 0-6-2.2-9.8-7-11 4.8-1.2 7-5 7-11Z"/></svg>
    </div>
    <img src="images/logo.png" alt="Zola" class="footer-logo rev-scale" style="--i:0">
    <p class="footer-tagline rev-scale" data-i18n="footer_text" style="--i:1"></p>

    <div class="footer-socials rev-scale" style="--i:2">
      <a href="https://www.facebook.com/profile.php?id=61591657936544&rdid=HLIWKNTWzBvqkMoA&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1EBZCszZyX%2F" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 22v-8.5H16l.5-3.5h-3V7.7c0-1 .3-1.7 1.7-1.7H16.6V2.8C16.2 2.8 15 2.7 13.7 2.7c-2.9 0-4.9 1.8-4.9 5v2.8H5.9V14h2.9v8h4.7z"/></svg>
      </a>
      <a href="https://www.instagram.com/zola_frankincense?igsh=ZnlxY3M1Nndkdmo1" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://wa.me/96877031260" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.06L2 22l5.11-1.34A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.19-1.77 1.24-.45.05-.98.24-3.29-.7-2.78-1.14-4.53-3.98-4.67-4.16-.14-.19-1.11-1.47-1.11-2.8 0-1.33.7-1.98.94-2.25.24-.27.53-.34.7-.34.18 0 .35 0 .5.01.16.01.38-.06.6.46.22.53.75 1.83.82 1.96.07.14.11.3.02.48-.09.19-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.6-.15 1.22z"/></svg>
      </a>
    </div>

    <div class="footer-rule"></div>
    <p class="footer-copy">© <span id="footerYear"></span> Zola — <span data-i18n="footer_rights"></span></p>
    <p class="footer-credit">Made by <a href="https://www.nuvex.agency" target="_blank" rel="noopener noreferrer">NUVEX</a></p>
  </footer>
</main>

<!-- Sticky order CTA (mobile) -->
<a href="#order" class="sticky-cta pulse-glow" id="stickyCta" data-i18n="hero_cta"></a>

<!-- WhatsApp floating button -->
<a href="https://wa.me/96877031260" target="_blank" rel="noopener noreferrer" class="whatsapp-fab pulse-glow" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.06L2 22l5.11-1.34A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.19-1.77 1.24-.45.05-.98.24-3.29-.7-2.78-1.14-4.53-3.98-4.67-4.16-.14-.19-1.11-1.47-1.11-2.8 0-1.33.7-1.98.94-2.25.24-.27.53-.34.7-.34.18 0 .35 0 .5.01.16.01.38-.06.6.46.22.53.75 1.83.82 1.96.07.14.11.3.02.48-.09.19-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.6-.15 1.22z"/></svg>
</a>

<!-- Thank-you overlay -->
<div class="thankyou" id="thankyou" hidden>
  <div class="ty-card pop-in">
    <div class="ty-ic icon">
